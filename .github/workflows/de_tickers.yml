name: Deutsche Kürzel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  de:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/de_tickers.py
      - run: |
          git config user.name "geld-kompass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/instruments.json
          git diff --cached --quiet || git commit -m "Deutsche Börsenkürzel ergänzt"
          git pull --rebase origin main
          git push origin HEAD:main

name: Deutsche Kürzel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  de:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2
      - run: python scripts/de_tickers.py
      - run: |
          git config user.name "geld-kompass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/instruments.json
          git diff --cached --quiet || git commit -m "Deutsche Börsenkürzel ergänzt"
          git pull --rebase origin main
          git push origin HEAD:main

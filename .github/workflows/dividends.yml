name: Dividenden

on:
  schedule:
    - cron: "23 4 * * 1"   # montags
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  div:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install yfinance==1.8.0
      - run: python scripts/dividends.py
      - run: python scripts/dividend_pages.py
      - run: python scripts/csp.py   # neu erzeugte Seiten bekommen wieder ihren CSP-Tag
      - id: save
        run: |
          git config user.name "geld-kompass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dividends.json dividenden-kalender en/dividend-calendar
          if ! git diff --cached --quiet; then git commit -m "Dividenden aktualisiert"; echo "changed=1" >> "$GITHUB_OUTPUT"; fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Tests starten (Veröffentlichung nur bei grünen Tests über „Webseite aktualisieren“)
        if: always() && steps.save.outputs.changed == '1' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main

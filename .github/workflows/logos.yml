name: Logos aktualisieren

on:
  schedule:
    - cron: "41 3 1 * *"   # monatlich
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests pillow
      - run: python scripts/logos.py
      - name: Logos speichern und veröffentlichen
        run: |
          git config user.name "geld-kompass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add logos data/logos.json data/logos_missing.json
          git diff --cached --quiet || git commit -m "Logos aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages

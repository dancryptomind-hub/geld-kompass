name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Sicherheitstests Server (Supabase Edge Functions)
        run: npx -y deno@2.9.6 test --allow-env supabase/functions/_shared/billing_test.ts
      - run: npm i --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tests/preset-icons.js
          node tests/preset-ui.js
          node tests/nomad-tax-link.js
          node tests/chart-interactions.js
          node tests/compass-interaction.js
          node tests/privacy-charts.js
          node tests/audit-calculation.js
          node tests/audit-context.js
          node tests/audit-fx-ui.js
          node tests/audit-portfolio-ui.js
          node tests/audit-context-ui.js
          node tests/visuals-ui.js
          node tests/visuals-site.js
          node tests/home-international.js
          node tests/visuals-offline.js
          node tests/plus-closed.js
          node tests/admin-preview-ui.js
          node tests/account-ui.js
          node tests/account-callbacks.js
          node tests/account-pkce.js
          node tests/account-recovery-code.js
          node tests/service-worker-auth.js
          node tests/csv_import.js
          node tests/smoke.js
          node tests/layout-gaps.js
          node tests/recurring-scan.js
          node tests/tour.js
          node tests/guide-wanderer.js
          node tests/guide-presence.js
          node tests/guide-menu.js
          node tests/guide-assistant.js
          node tests/guide-assistant-ui.js
          node tests/dividends-logic.js
          node tests/assets-history.js
          node tests/audit-phases.js
          node tests/wealth-cases.js
          node tests/ux-mode-lang.js
          node tests/mobile-ux.js
          node tests/billing-ui.js
          node tests/freedom-report.js
          node tests/month-gap.js
          node tests/persona-numbers.js
          node tests/bank-import.js
          node tests/history-report.js
          node tests/focus.js
          node tests/capital-need.js
          node tests/plus-not-public.js
          node tests/account-gate.js
          node tests/income-sources.js
          node tests/plus-nav.js
          node tests/tax-pages.js
          node tests/workbook-launch.js
          GK_TEST_BASE=http://localhost:8765 node tests/workbook-delivery.js
          node tests/share-links.js
          node tests/app-share-links.js
          node tests/csp.js
          node tests/security-xss.js
          node tests/frame-guard.js

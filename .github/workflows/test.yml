name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Sicherheitstests Server (Supabase Edge Functions)
        run: npx -y deno@2.9.6 test --allow-env supabase/functions/_shared/billing_test.ts
      - run: npm i --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          GK_TEST_BASE=http://localhost:8765 timeout 120 node tests/workbook-delivery.js || true

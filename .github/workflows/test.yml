name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tests/preset-icons.js
          node tests/preset-ui.js
          node tests/visuals-ui.js
          node tests/visuals-site.js
          node tests/visuals-offline.js
          node tests/plus-closed.js
          node tests/admin-preview-ui.js
          node tests/account-ui.js
          node tests/account-callbacks.js
          node tests/account-pkce.js
          node tests/account-recovery-code.js
          node tests/service-worker-auth.js
          node tests/csv_import.js
          node tests/smoke.js
          node tests/layout-gaps.js
          node tests/share-links.js
          node tests/app-share-links.js

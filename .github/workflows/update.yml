name: Kurse und Inflation aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"   # täglich 05:17 UTC, in Deutschland 06:17 bzw. 07:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - run: python scripts/update_data.py
      - name: Änderungen speichern
        if: always()
        run: |
          git config user.name "geld-kompass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/markets.json
          git diff --cached --quiet || git commit -m "Kurse und Inflation aktualisiert"
          git push
